<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#021836"/>
      <stop offset="1" stop-color="#04264f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#0A95C9" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#0A95C9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#0A95C9" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
      .line { fill: none; stroke: #0A95C9; stroke-width: 2; stroke-opacity: .55; }
      .pulse { fill: none; stroke: #4cc8f5; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 40 900; animation: run 4.5s linear infinite; }
      .p2 { animation-delay: 1.2s; } .p3 { animation-delay: 2.4s; stroke: #FC6E08; } .p4 { animation-delay: 3.3s; }
      @keyframes run { from { stroke-dashoffset: 940; } to { stroke-dashoffset: 0; } }
      .node { fill: #0A95C9; } .core { fill: #FC6E08; animation: beat 2.4s ease-in-out infinite; transform-origin: 940px 170px; }
      @keyframes beat { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.5); opacity: .55 } }
      .fade { opacity: 0; animation: in .9s ease-out forwards; } .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
      @keyframes in { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: translateY(0) } }
      .caret { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity: 0 } }
      @media (prefers-reduced-motion: reduce) { .pulse, .core, .caret { animation: none } .fade { animation: none; opacity: 1 } }
    </style>
  </defs>
  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- obwody zbiegające się w jednym rdzeniu: wiele procesów, jeden system -->
  <g>
    <path id="a" class="line" d="M640 70 H760 L820 130 H900 L940 170"/>
    <path id="b" class="line" d="M610 170 H940"/>
    <path id="c" class="line" d="M650 270 H770 L840 200 H900 L940 170"/>
    <path id="d" class="line" d="M940 170 L990 120 H1080 L1120 80 H1200"/>
    <path id="e" class="line" d="M940 170 H1200"/>
    <path id="f" class="line" d="M940 170 L1000 230 H1090 L1130 270 H1200"/>
    <path class="pulse" d="M640 70 H760 L820 130 H900 L940 170 L990 120 H1080 L1120 80 H1200"/>
    <path class="pulse p2" d="M610 170 H1200"/>
    <path class="pulse p3" d="M650 270 H770 L840 200 H900 L940 170 L1000 230 H1090 L1130 270 H1200"/>
    <path class="pulse p4" d="M640 70 H760 L820 130 H900 L940 170 H1200"/>
    <circle class="node" cx="640" cy="70" r="5"/><circle class="node" cx="610" cy="170" r="5"/><circle class="node" cx="650" cy="270" r="5"/>
    <circle class="node" cx="820" cy="130" r="4"/><circle class="node" cx="840" cy="200" r="4"/>
    <circle cx="940" cy="170" r="22" fill="#021836" stroke="#0A95C9" stroke-width="2"/>
    <circle class="core" cx="940" cy="170" r="9"/>
  </g>

  <g class="t">
    <text class="fade d1" x="64" y="96" fill="#4cc8f5" font-size="16" font-weight="600" letter-spacing="4">CYFROWNIA · GRUDZIĄDZ</text>
    <text class="fade d2" x="62" y="168" fill="#ffffff" font-size="64" font-weight="700" letter-spacing="-1">Jacek Zielke</text>
    <text class="fade d3" x="64" y="214" fill="#c9dcea" font-size="24" font-weight="400">AI Systems Builder · Automation Architect</text>
    <g class="fade d4">
      <rect x="64" y="246" width="430" height="44" rx="8" fill="#0A95C9" fill-opacity=".14" stroke="#0A95C9" stroke-opacity=".5"/>
      <text x="84" y="275" fill="#e8f3fa" font-size="17" font-family="Consolas, 'Courier New', monospace">$ buduję systemy, które prowadzą firmę</text>
      <rect class="caret" x="474" y="259" width="9" height="20" fill="#FC6E08"/>
    </g>
  </g>
</svg>
